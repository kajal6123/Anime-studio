
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimStudio - Scene Editor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101322;color:#fff;font-family:Arial,sans-serif}
header{padding:15px;background:#191f35;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
h2{font-size:19px;margin:0}
button,select,input{border:0;border-radius:9px;padding:10px;background:#252d49;color:white}
button{cursor:pointer;background:#7657ed;font-weight:bold}
button.secondary{background:#303953}
main{padding:12px;max-width:850px;margin:auto}
.panel{background:#191f35;border:1px solid #303953;border-radius:14px;padding:13px;margin-bottom:13px}
label{display:block;font-size:12px;color:#b8c2df;margin:10px 0 5px}
input,select{width:100%;margin-bottom:5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:90px}
#stageWrap{width:100%;display:flex;justify-content:center;background:#080b15;border-radius:12px;padding:10px}
canvas{max-width:100%;max-height:65vh;background:#ddd;border-radius:5px;touch-action:none}
#sceneList{display:flex;gap:7px;overflow:auto}
.sceneBtn{min-width:90px;background:#303953}
.sceneBtn.active{background:#7657ed}
.small{font-size:12px;color:#b8c2df}
</style>
</head>
<body>
<header>
  <h2>🎬 AnimStudio Editor</h2>
  <button onclick="saveProject()">Save Project</button>
</header>

<main>
  <section class="panel">
    <label>Video Ratio</label>
    <select id="ratio" onchange="changeRatio()">
      <option value="9:16">9:16 - Shorts / Reels</option>
      <option value="16:9">16:9 - YouTube</option>
      <option value="1:1">1:1 - Square</option>
      <option value="4:5">4:5 - Portrait</option>
    </select>
    <div id="stageWrap"><canvas id="stage" width="720" height="1280"></canvas></div>
    <p class="small">Canvas par character ya object ko touch karke select karo. Drag karke position badlo.</p>
  </section>

  <section class="panel">
    <b>🎭 Character</b>
    <label>Designer Character</label>
    <select id="characterSelect" onchange="selectCharacter()"></select>
    <label>Animation</label>
    <select id="motion">
      <option value="idle">Idle</option>
      <option value="walk">Walk</option>
      <option value="run">Run</option>
      <option value="wave">Wave</option>
      <option value="jump">Jump</option>
      <option value="talk">Talk</option>
      <option value="cook">Cooking</option>
      <option value="serve">Serving</option>
      <option value="shop">Shopkeeping</option>
      <option value="clean">Cleaning</option>
      <option value="write">Writing</option>
      <option value="dance">Dance</option>
    </select>
    <label>Character Size</label>
    <input id="charSize" type="range" min="0.4" max="2" step="0.1" value="1">
    <label>Custom Character Image (PNG/JPG/WebP)</label>
    <input type="file" id="characterUpload" accept="image/png,image/jpeg,image/webp">
    <button class="secondary" onclick="uploadCharacter()">Add Custom Character</button>
  </section>

  <section class="panel">
    <b>🌄 Background</b>
    <select id="background" onchange="render()">
      <option value="village">Village</option>
      <option value="city">City</option>
      <option value="jungle">Jungle</option>
      <option value="horror">Horror Night</option>
      <option value="kitchen">Kitchen</option>
      <option value="room">Room</option>
      <option value="school">School</option>
      <option value="sky">Blue Sky</option>
    </select>
    <label>Upload Background Image</label>
    <input type="file" id="backgroundUpload" accept="image/*">
    <button class="secondary" onclick="uploadBackground()">Use Background Image</button>
  </section>

  <section class="panel">
    <b>🚗 Add Objects / Vehicles</b>
    <div class="row">
      <button onclick="addObject('🚗','Car')">🚗 Car</button>
      <button onclick="addObject('🛺','Auto')">🛺 Auto</button>
      <button onclick="addObject('🚲','Bicycle')">🚲 Cycle</button>
      <button onclick="addObject('🏍️','Bike')">🏍️ Bike</button>
      <button onclick="addObject('🚌','Bus')">🚌 Bus</button>
      <button onclick="addObject('🛵','Scooter')">🛵 Scooter</button>
      <button onclick="addObject('🏠','House')">🏠 House</button>
      <button onclick="addObject('🌳','Tree')">🌳 Tree</button>
      <button onclick="addObject('🪑','Chair')">🪑 Chair</button>
      <button onclick="addObject('🍲','Food')">🍲 Food</button>
    </div>
    <label>Upload Your Own Object / Prop</label>
    <input type="file" id="objectUpload" accept="image/*">
    <button class="secondary" onclick="uploadObject()">Add Uploaded Object</button>
  </section>

  <section class="panel">
    <b>🎯 Selected Item Controls</b>
    <p class="small" id="selectedInfo">Select a character or object on the canvas.</p>
    <label>Horizontal Position</label>
    <input id="posX" type="range" min="0" max="100" value="50" oninput="updateSelected()">
    <label>Vertical Position</label>
    <input id="posY" type="range" min="0" max="100" value="70" oninput="updateSelected()">
    <label>Size</label>
    <input id="itemSize" type="range" min="20" max="300" value="100" oninput="updateSelected()">
    <div class="row">
      <button class="secondary" onclick="moveLayer(-1)">Send Back</button>
      <button class="secondary" onclick="moveLayer(1)">Bring Front</button>
      <button onclick="deleteSelected()">Delete</button>
    </div>
  </section>

  <section class="panel">
    <b>⏱️ Scene Settings</b>
    <label>Scene Duration (seconds)</label>
    <input id="duration" type="number" min="1" max="600" value="5">
    <div class="row">
      <button onclick="addScene()">+ New Scene</button>
      <button class="secondary" onclick="duplicateScene()">Duplicate</button>
      <button class="secondary" onclick="deleteScene()">Delete Scene</button>
    </div>
    <label>All Scenes</label>
    <div id="sceneList"></div>
  </section>

  <section class="panel">
    <div class="row">
      <button onclick="saveProject()">💾 Save</button>
      <button class="secondary" onclick="exportJSON()">Download Project JSON</button>
    </div>
    <p class="small" id="status">Ready</p>
  </section>
</main>

<script src="rig.js"></script>
<script>
"use strict";

const canvas=document.getElementById("stage");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const DB_NAME="AnimStudioAssetsDB";
let db=null, characters=[], project={name:"My Animation",scenes:[]};
let sceneIndex=0,selected={type:"character",id:"character"};
let customCharacter=null, backgroundImage=null, objectImages={};
let dragging=false,dragTarget=null,clock=0;

const backgrounds={
 village:["#8ed5f4","#d6f4ff","#78b75b"],
 city:["#8bc9ec","#d5edff","#777d91"],
 jungle:["#164b38","#347b4c","#173b2c"],
 horror:["#11172b","#34334b","#11121c"],
 kitchen:["#f6d7a5","#f4e6ca","#b98d62"],
 room:["#9bc4d9","#e8d8c4","#a77b64"],
 school:["#9bd8f1","#f5e6c9","#77a36b"],
 sky:["#42a5f5","#c6efff","#74c6ef"]
};

function openDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("assets"))req.result.createObjectStore("assets",{keyPath:"id"});};
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}
async function storeAsset(file,name){
 const id="asset_"+Date.now()+"_"+Math.random().toString(36).slice(2);
 await new Promise((resolve,reject)=>{
  const tx=db.transaction("assets","readwrite");
  tx.objectStore("assets").put({id,name,mime:file.type,blob:file});
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
 return id;
}
async function getAsset(id){
 return new Promise(resolve=>{
  const tx=db.transaction("assets","readonly");
  const req=tx.objectStore("assets").get(id);
  req.onsuccess=()=>resolve(req.result||null);
  req.onerror=()=>resolve(null);
 });
}
function loadCharacters(){
 try{characters=JSON.parse(localStorage.getItem("animstudio_characters")||"[]");}catch(e){characters=[];}
 if(!characters.length){
  characters=[{id:"aarav",name:"Aarav",skin:"#d99b72",hair:"#30201d",outfit:"#4169a9",accent:"#f4bd42"}];
 }
 const select=$("characterSelect");
 select.innerHTML="";
 characters.forEach((c,i)=>{
  const op=document.createElement("option");
  op.value=c.id;op.textContent=c.name||"Character "+(i+1);
  select.appendChild(op);
 });
}
function newScene(){
 return {
  id:"scene_"+Date.now(),name:"Scene "+(project.scenes.length+1),
  characterId:characters[0]?.id||null,
  characterName:characters[0]?.name||"Aarav",
  animation:"idle",background:"village",duration:5,
  x:50,y:70,scale:1,audio:null,objects:[]
 };
}
function current(){return project.scenes[sceneIndex];}
function loadSceneControls(){
 const s=current();if(!s)return;
 $("characterSelect").value=s.characterId||characters[0]?.id||"";
 $("motion").value=s.animation||"idle";
 $("background").value=s.background||"village";
 $("duration").value=s.duration||5;
 $("charSize").value=s.scale||1;
 selected={type:"character",id:"character"};
 syncSelectionControls();
 renderSceneList();render();
}
function selectCharacter(){
 const s=current(),c=characters.find(x=>x.id===$("characterSelect").value);
 if(!s||!c)return;
 s.characterId=c.id;s.characterName=c.name;
 render();
}
$("motion").addEventListener("change",()=>{if(current()){current().animation=$("motion").value;render();}});
$("charSize").addEventListener("input",()=>{if(current()){current().scale=Number($("charSize").value);render();}});
$("duration").addEventListener("change",()=>{if(current())current().duration=Math.max(1,Number($("duration").value)||5);});
function changeRatio(){
 const r=$("ratio").value;
 const sizes={"9:16":[720,1280],"16:9":[1280,720],"1:1":[900,900],"4:5":[800,1000]};
 [canvas.width,canvas.height]=sizes[r];
 render();
}
function drawBackground(s){
 if(backgroundImage){
  ctx.drawImage(backgroundImage,0,0,canvas.width,canvas.height);return;
 }
 const colors=backgrounds[s.background]||backgrounds.village;
 const g=ctx.createLinearGradient(0,0,0,canvas.height);
 g.addColorStop(0,colors[0]);g.addColorStop(.65,colors[1]);g.addColorStop(1,colors[2]);
 ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="rgba(255,255,255,.2)";
 ctx.beginPath();ctx.arc(canvas.width*.78,canvas.height*.16,canvas.width*.07,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=colors[2];
 ctx.fillRect(0,canvas.height*.78,canvas.width,canvas.height*.22);
 if(s.background==="city"){
  for(let i=0;i<8;i++){
   let x=i*canvas.width/8;
   ctx.fillStyle="#58647d";ctx.fillRect(x,canvas.height*.45,canvas.width/10,canvas.height*.34);
   ctx.fillStyle="#f9dc86";
   for(let j=0;j<3;j++)ctx.fillRect(x+10+j*18,canvas.height*.49,8,12);
  }
 }
 if(s.background==="horror"){
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#18241c";
  for(let i=0;i<5;i++){
   let x=i*canvas.width/4;
   ctx.fillRect(x,canvas.height*.35,18,canvas.height*.45);
   ctx.beginPath();ctx.arc(x+9,canvas.height*.34,canvas.width*.09,0,Math.PI*2);ctx.fill();
  }
 }
}
function characterData(s){
 return characters.find(c=>c.id===s.characterId)||characters[0]||{};
}
function drawCharacter(s){
 const c=characterData(s);
 if(customCharacter){
  const w=canvas.width*.25*(s.scale||1);
  const h=w*1.4;
  ctx.drawImage(customCharacter,canvas.width*.5-w/2,canvas.height*.7-h,w,h);
  return;
 }
 if(window.AnimStudioRig&&c){
  const x=canvas.width*(Number(s.x??50)/100);
  const y=canvas.height*(Number(s.y??70)/100);
  const scale=(canvas.width/720)*Number(s.scale||1);
  AnimStudioRig.draw(ctx,c,s.animation||"idle",clock,x,y,scale);
 }
}
function drawObjects(s){
 (s.objects||[]).forEach(o=>{
  const x=canvas.width*(o.x/100),y=canvas.height*(o.y/100);
  const size=o.size||90;
  if(o.assetId&&objectImages[o.assetId]){
   const img=objectImages[o.assetId];
   const ratio=img.width/img.height||1;
   ctx.drawImage(img,x-size/2,y-size/(2*ratio),size,size/ratio);
  }else{
   ctx.font=size+"px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.fillText(o.emoji||"⭐",x,y);
  }
  if(selected.type==="object"&&selected.id===o.id){
   ctx.strokeStyle="#ffe45e";ctx.lineWidth=3;
   ctx.strokeRect(x-size/2,y-size/2,size,size);
  }
 });
}
function render(){
 const s=current();if(!s)return;
 drawBackground(s);
 drawObjects(s);
 drawCharacter(s);
 if(selected.type==="character"){
  const x=canvas.width*(Number(s.x??50)/100),y=canvas.height*(Number(s.y??70)/100);
  ctx.strokeStyle="#ffe45e";ctx.lineWidth=2;
  ctx.strokeRect(x-canvas.width*.13,y-canvas.height*.3,canvas.width*.26,canvas.height*.32);
 }
}
function addObject(emoji,name){
 const s=current();if(!s)return;
 const o={id:"obj_"+Date.now(),kind:"emoji",emoji,name,x:50,y:55,size:90};
 s.objects.push(o);selected={type:"object",id:o.id};
 syncSelectionControls();render();
}
async function uploadObject(){
 const file=$("objectUpload").files[0];if(!file)return alert("Pehle image choose karo.");
 const id=await storeAsset(file,file.name);
 const asset=await getAsset(id);
 const url=URL.createObjectURL(asset.blob),img=new Image();
 img.onload=()=>{objectImages[id]=img;};
 img.src=url;
 const s=current();
 const o={id:"obj_"+Date.now(),kind:"upload",name:file.name,assetId:id,x:50,y:55,size:130};
 s.objects.push(o);selected={type:"object",id:o.id};
 syncSelectionControls();render();
}
async function uploadCharacter(){
 const file=$("characterUpload").files[0];if(!file)return alert("Pehle character image choose karo.");
 const id=await storeAsset(file,file.name);
 const asset=await getAsset(id);
 const url=URL.createObjectURL(asset.blob),img=new Image();
 img.onload=()=>{customCharacter=img;render();};
 img.src=url;
 $("status").textContent="Custom character added. Ye image-based character hai, rigged character nahi.";
}
async function uploadBackground(){
 const file=$("backgroundUpload").files[0];if(!file)return alert("Pehle background image choose karo.");
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{backgroundImage=img;render();};
 img.src=url;
}
function findSelected(){
 const s=current();if(!s)return null;
 if(selected.type==="character")return s;
 return s.objects.find(o=>o.id===selected.id)||null;
}
function syncSelectionControls(){
 const item=findSelected();if(!item)return;
 $("selectedInfo").textContent=selected.type==="character"?"Selected: Character":"Selected: "+(item.name||"Object");
 $("posX").value=item.x??50;$("posY").value=item.y??70;
 $("itemSize").value=selected.type==="character"?Number(current().scale||1)*100:(item.size||90);
}
function updateSelected(){
 const item=findSelected();if(!item)return;
 item.x=Number($("posX").value);item.y=Number($("posY").value);
 if(selected.type==="character"){
  current().scale=Number($("itemSize").value)/100;
  $("charSize").value=current().scale;
 }else item.size=Number($("itemSize").value);
 render();
}
function deleteSelected(){
 const s=current();if(!s)return;
 if(selected.type==="object")s.objects=s.objects.filter(o=>o.id!==selected.id);
 selected={type:"character",id:"character"};syncSelectionControls();render();
}
function moveLayer(dir){
 const s=current();if(!s||selected.type!=="object")return;
 const i=s.objects.findIndex(o=>o.id===selected.id),j=i+dir;
 if(i<0||j<0||j>=s.objects.length)return;
 [s.objects[i],s.objects[j]]=[s.objects[j],s.objects[i]];
 render();
}
canvas.addEventListener("pointerdown",e=>{
 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)*canvas.width/r.width;
 const y=(e.clientY-r.top)*canvas.height/r.height;
 const s=current();if(!s)return;
 let found=null;
 for(let i=s.objects.length-1;i>=0;i--){
  const o=s.objects[i],ox=canvas.width*o.x/100,oy=canvas.height*o.y/100;
  if(Math.abs(x-ox)<(o.size||90)&&Math.abs(y-oy)<(o.size||90)){found=o;break;}
 }
 if(found){selected={type:"object",id:found.id};}
 else selected={type:"character",id:"character"};
 syncSelectionControls();dragging=true;dragTarget={x,y};
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
 if(!dragging)return;
 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)*canvas.width/r.width;
 const y=(e.clientY-r.top)*canvas.height/r.height;
 const item=findSelected();if(!item)return;
 item.x=Math.max(0,Math.min(100,x/canvas.width*100));
 item.y=Math.max(0,Math.min(100,y/canvas.height*100));
 syncSelectionControls();render();
});
canvas.addEventListener("pointerup",()=>{dragging=false;});
function addScene(){
 project.scenes.push(newScene());sceneIndex=project.scenes.length-1;
 loadSceneControls();
}
function duplicateScene(){
 const s=current();if(!s)return;
 const copy=JSON.parse(JSON.stringify(s));copy.id="scene_"+Date.now();copy.name=s.name+" Copy";
 project.scenes.splice(sceneIndex+1,0,copy);sceneIndex++;
 loadSceneControls();
}
function deleteScene(){
 if(project.scenes.length<=1)return alert("Kam se kam ek scene rehna chahiye.");
 project.scenes.splice(sceneIndex,1);sceneIndex=Math.max(0,sceneIndex-1);loadSceneControls();
}
function renderSceneList(){
 const el=$("sceneList");el.innerHTML="";
 project.scenes.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="sceneBtn"+(i===sceneIndex?" active":"");
  b.textContent=(i+1)+". "+s.name;
  b.onclick=()=>{sceneIndex=i;customCharacter=null;backgroundImage=null;loadSceneControls();};
  el.appendChild(b);
 });
}
function saveProject(){
 localStorage.setItem("animstudio_project",JSON.stringify(project));
 let projects=[];try{projects=JSON.parse(localStorage.getItem("animstudio_projects")||"[]");}catch(e){}
 const idx=projects.findIndex(p=>p.id===project.id);
 if(idx>=0)projects[idx]=project;else projects.push(project);
 localStorage.setItem("animstudio_projects",JSON.stringify(projects));
 $("status").textContent="Project saved successfully!";
}
function exportJSON(){
 saveProject();
 const blob=new Blob([JSON.stringify(project,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download="animstudio-project.json";a.click();URL.revokeObjectURL(a.href);
}
function animate(){
 clock+=0.035;render();requestAnimationFrame(animate);
}
async function init(){
 try{db=await openDB();}catch(e){console.warn("Asset storage unavailable",e);}
 loadCharacters();
 try{
  const old=JSON.parse(localStorage.getItem("animstudio_project")||"null");
  if(old&&Array.isArray(old.scenes)&&old.scenes.length)project=old;
 }catch(e){}
 if(!project.scenes.length)project.scenes=[newScene()];
 project.scenes.forEach(s=>{if(!s.objects)s.objects=[];});
 loadSceneControls();animate();
}
init();
</script>
</body>
</html>
