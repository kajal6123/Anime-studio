
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimStudio - Backgrounds</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111c;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;display:flex;align-items:center;justify-content:space-between;background:#191a29;position:sticky;top:0;z-index:5}
header h2{margin:0;font-size:21px}
a{color:#aaa;text-decoration:none}
main{padding:18px;max-width:1000px;margin:auto}
h3{margin:22px 0 12px}
.search{width:100%;padding:14px;border:1px solid #34364b;border-radius:12px;background:#202235;color:white;font-size:15px}
.categories{display:flex;gap:9px;overflow:auto;padding:14px 0}
.categories button{white-space:nowrap;border:1px solid #393b50;background:#202235;color:white;padding:10px 15px;border-radius:20px}
.categories button.active{background:#8b5cf6;border-color:#8b5cf6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px}
.card{background:#202235;border:2px solid transparent;border-radius:15px;overflow:hidden;cursor:pointer}
.card.selected{border-color:#a78bfa}
.scene{height:125px;position:relative;overflow:hidden}
.scene:before,.scene:after{content:"";position:absolute;border-radius:50%}
.scene .sun{position:absolute;width:35px;height:35px;border-radius:50%;background:#ffe28a;top:15px;right:20px}
.scene .hill{position:absolute;width:180px;height:100px;border-radius:50% 50% 0 0;bottom:-55px;left:-30px;background:#286b4b}
.scene .hill.two{left:65px;bottom:-65px;background:#174b3c}
.scene .house{position:absolute;bottom:23px;left:45%;width:48px;height:38px;background:#d9a66b}
.scene .roof{position:absolute;bottom:61px;left:calc(45% - 7px);width:0;height:0;border-left:31px solid transparent;border-right:31px solid transparent;border-bottom:28px solid #8d4242}
.scene .tree{position:absolute;bottom:20px;left:15px;width:18px;height:55px;background:#68452c}
.scene .tree:after{content:"";position:absolute;top:-22px;left:-14px;width:46px;height:45px;border-radius:50%;background:#216345}
.scene .label{position:absolute;bottom:8px;left:10px;font-size:11px;background:#0008;padding:5px 8px;border-radius:8px}
.card-info{padding:11px}
.card-info b{font-size:14px}
.card-info small{display:block;color:#aaa;margin-top:5px}
.horror{background:linear-gradient(#15152c,#3b253d 60%,#171b27)}
.village{background:linear-gradient(#8ac9ed,#e6dfaa 65%,#4d9b62)}
.jungle{background:linear-gradient(#83c6a1,#164b38)}
.city{background:linear-gradient(#70a5d8,#252b4c)}
.school{background:linear-gradient(#a8d7ed,#e8d9a6)}
.kitchen{background:linear-gradient(#b9cbd1,#596e7b)}
.room{background:linear-gradient(#e9b6a8,#735c80)}
.night{background:linear-gradient(#10152f,#293c5d)}
.beach{background:linear-gradient(#6dc5e6,#f7dc9b 65%,#d6b66e)}
.forest{background:linear-gradient(#9bc78a,#24573e)}
.preview{margin-top:20px;padding:15px;background:#202235;border-radius:15px}
.preview-box{height:150px;border-radius:12px;position:relative;overflow:hidden}
#selectedName{font-weight:bold;margin:10px 0}
.action{width:100%;padding:14px;border:0;border-radius:12px;background:#8b5cf6;color:white;font-weight:bold;font-size:15px;margin-top:12px}
.empty{color:#aaa;text-align:center;padding:25px;display:none}
</style>
</head>
<body>
<header>
<a href="index.html">← Characters</a>
<h2>🌄 Backgrounds</h2>
<a href="animations.html">Animations →</a>
</header>
<main>
<h3>Choose your scene</h3>
<input class="search" id="search" placeholder="🔍 Search backgrounds..." oninput="render()">
<div class="categories" id="categories"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">No backgrounds found.</div>

<div class="preview">
<h3>Selected Background</h3>
<div class="preview-box village" id="preview">
<div class="sun"></div><div class="hill"></div><div class="hill two"></div>
<div class="tree"></div><div class="house"></div><div class="roof"></div>
</div>
<div id="selectedName">No background selected</div>
<button class="action" onclick="saveBackground()">✓ Save Background</button>
</div>
</main>

<script>
const backgrounds=[
["Village Morning","Village","village"],
["Haunted Village","Horror","horror"],
["Dark Forest","Horror","night"],
["Green Jungle","Nature","jungle"],
["Deep Forest","Nature","forest"],
["Modern City","City","city"],
["City Night","City","night"],
["School Campus","Places","school"],
["Classroom","Places","school"],
["Modern Kitchen","Home","kitchen"],
["Simple Bedroom","Home","room"],
["Beautiful Beach","Nature","beach"],
["Midnight Scene","Night","night"],
["Old Haunted House","Horror","horror"]
];

const categories=["All","Village","Horror","Nature","City","Places","Home","Night"];
let active="All",selected=null;

function renderCategories(){
 document.getElementById("categories").innerHTML=categories.map(c=>
 `<button class="${active===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`
 ).join("");
}
function setCategory(c){active=c;render()}
function sceneHTML(type){
 return `<div class="scene ${type}">
 <div class="sun"></div><div class="hill"></div><div class="hill two"></div>
 <div class="tree"></div><div class="house"></div><div class="roof"></div>
 </div>`;
}
function render(){
 renderCategories();
 const q=document.getElementById("search").value.toLowerCase();
 const list=backgrounds.filter(b=>
 (active==="All"||b[1]===active)&&b[0].toLowerCase().includes(q)
 );
 document.getElementById("empty").style.display=list.length?"none":"block";
 document.getElementById("grid").innerHTML=list.map(b=>
 `<div class="card ${selected&&selected[0]===b[0]?'selected':''}" onclick="choose('${b[0]}')">
 ${sceneHTML(b[2])}
 <div class="card-info"><b>${b[0]}</b><small>${b[1]}</small></div>
 </div>`
 ).join("");
}
function choose(name){
 selected=backgrounds.find(b=>b[0]===name);
 const p=document.getElementById("preview");
 p.className="preview-box "+selected[2];
 p.innerHTML='<div class="sun"></div><div class="hill"></div><div class="hill two"></div><div class="tree"></div><div class="house"></div><div class="roof"></div>';
 document.getElementById("selectedName").textContent=selected[0];
 render();
}
function saveBackground(){
 if(!selected){alert("Pehle background select karo!");return}
 localStorage.setItem("animstudio_selected_background",JSON.stringify({
 name:selected[0],category:selected[1],style:selected[2]
 }));
 alert("Background saved!");
}
render();
</script>
</body>
</html>
