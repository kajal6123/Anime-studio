
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimStudio — Character Designer</title>
<style>
:root {
  --bg:#10121b; --panel:#191d2a; --panel2:#222838;
  --text:#f5f5ff; --muted:#9ba3b8; --pink:#ff5c9a;
  --purple:#8b7cff; --line:#30384b;
}
* {box-sizing:border-box}
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:Arial,sans-serif;
}
header {
  padding:18px 16px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:5; background:#10121bee;
}
.logo {font-size:21px;font-weight:800}
.logo span {color:var(--pink)}
.small {color:var(--muted);font-size:12px;margin-top:4px}
button,select,input {font:inherit}
button {
  border:1px solid var(--line); border-radius:10px;
  padding:10px 13px; color:var(--text);
  background:var(--panel2); cursor:pointer;
}
button.active,.primary {
  background:linear-gradient(120deg,var(--pink),var(--purple));
  border:0;color:white;font-weight:bold;
}
main {max-width:1100px;margin:auto;padding:18px 14px 40px}
h2 {font-size:19px;margin:0 0 14px}
h3 {font-size:14px;margin:0 0 12px;color:#dfe3f5}
.layout {
  display:grid;grid-template-columns:1fr 1.2fr;
  gap:16px;align-items:start;
}
.panel {
  background:var(--panel);border:1px solid var(--line);
  border-radius:17px;padding:16px;margin-bottom:15px;
}
.characters {
  display:grid;grid-template-columns:repeat(2,1fr);gap:9px;
}
.character {
  border:1px solid var(--line);border-radius:12px;
  padding:10px;background:#141824;text-align:center;
  cursor:pointer;
}
.character.selected {border:2px solid var(--pink)}
.character .mini {
  width:100%;height:76px;display:block;
}
.character b {font-size:12px}
.preview {
  background:radial-gradient(ellipse,#30364b,#171b28 70%);
  border:1px solid var(--line);border-radius:15px;
  min-height:340px;display:flex;align-items:center;
  justify-content:center;position:relative;overflow:hidden;
}
#stage {width:100%;height:330px}
.view-buttons {
  display:flex;gap:7px;overflow-x:auto;padding:12px 0;
}
.view-buttons button {white-space:nowrap;font-size:12px}
.field {margin:14px 0}
.field label {
  display:block;color:var(--muted);font-size:12px;
  margin-bottom:8px;
}
input[type=text] {
  width:100%;background:#111521;color:white;
  border:1px solid var(--line);border-radius:9px;
  padding:12px;outline:none;
}
input[type=color] {
  width:100%;height:42px;border:1px solid var(--line);
  border-radius:9px;background:#111521;padding:4px;
}
.controls {
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.actions {display:flex;gap:8px;flex-wrap:wrap}
.actions button {flex:1}
.note {font-size:12px;color:var(--muted);line-height:1.6}
.empty {color:var(--muted);font-size:13px}
@media(max-width:700px) {
  .layout {grid-template-columns:1fr}
  .preview {min-height:300px}
  #stage {height:300px}
  main {padding:14px 11px 30px}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Anim<span>Studio</span></div>
    <div class="small">Character Designer · Module 01</div>
  </div>
  <button onclick="downloadPNG()">↓ Export</button>
</header>

<main>
  <div class="layout">

    <section>
      <div class="panel">
        <h2>Character Library</h2>
        <div class="small" style="margin-bottom:14px">
          Choose a character to start designing.
        </div>
        <div class="characters" id="characterList"></div>
        <div class="actions" style="margin-top:13px">
          <button class="primary" onclick="addCharacter()">＋ New Character</button>
        </div>
      </div>
    </section>

    <section>
      <div class="panel">
        <h2>Character Preview</h2>
        <div class="preview">
          <svg id="stage" viewBox="0 0 300 330"
               xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <div class="view-buttons" id="views">
          <button class="active" data-view="front">Front</button>
          <button data-view="back">Back</button>
          <button data-view="left">Left</button>
          <button data-view="right">Right</button>
          <button data-view="three">3/4 View</button>
        </div>

        <div class="note">
          Preview updates when you change a view or a character's design.
        </div>
      </div>

      <div class="panel">
        <h2>Customize Character</h2>

        <div class="field">
          <label>Character Name</label>
          <input id="charName" type="text" maxlength="24"
                 placeholder="Enter character name">
        </div>

        <div class="controls">
          <div class="field">
            <label>Skin Colour</label>
            <input id="skin" type="color" value="#d99b72">
          </div>
          <div class="field">
            <label>Hair Colour</label>
            <input id="hair" type="color" value="#30201d">
          </div>
          <div class="field">
            <label>Outfit Colour</label>
            <input id="outfit" type="color" value="#7355dc">
          </div>
          <div class="field">
            <label>Accent Colour</label>
            <input id="accent" type="color" value="#ffc857">
          </div>
        </div>

        <div class="actions">
          <button onclick="resetCharacter()">Reset</button>
          <button class="primary" onclick="saveCharacter()">Save Character</button>
        </div>
        <p class="note" id="message">
          Your saved designs stay in this browser on this device.
        </p>
      </div>
    </section>

  </div>
</main>

<script>
const defaults = [
  ["Aarav","#d99b72","#30201d","#4169a9","#f4bd42"],
  ["Mira","#edbd96","#251b28","#b84f7c","#f4d5a5"],
  ["Kabir","#a96f4d","#171717","#397d69","#e6b64e"],
  ["Tara","#e5aa80","#633a24","#8057c8","#f1c75b"],
  ["Dev","#f0c6a0","#4a3025","#d85b50","#f5d58b"],
  ["Riya","#b97959","#161616","#3685b9","#f1c75b"],
  ["Ishaan","#d49a72","#30251c","#5064c9","#e8b74c"],
  ["Anaya","#efc5a5","#38202a","#e46c9c","#f4cf69"],
  ["Veer","#986345","#201a17","#547a42","#dfb65b"],
  ["Kiara","#dca582","#4a2c20","#8e5ab5","#f3d5a3"]
];

let characters = defaults.map((c,i)=>({
  id:i+1,name:c[0],skin:c[1],hair:c[2],
  outfit:c[3],accent:c[4]
}));

try {
  const stored=JSON.parse(localStorage.getItem("animstudio_characters"));
  if(Array.isArray(stored) && stored.length) characters=stored;
} catch(e) {}

let selected=0;
let currentView="front";

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
}[c]));

function current(){return characters[selected]}

function saveLocal(){
  localStorage.setItem("animstudio_characters",
    JSON.stringify(characters));
}

function avatar(c,view="front"){
  let side=view==="left"||view==="right";
  let back=view==="back";
  let flip=view==="right";
  let shift=back?0:(side?20:0);

  return `
  <svg viewBox="0 0 300 330" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="150" cy="303" rx="61" ry="9" fill="#080a12" opacity=".5"/>
    <g transform="translate(${shift} 0) ${flip?"translate(300 0) scale(-1 1)":""}">
      <!-- Legs -->
      <path d="M119 225 L116 286 Q130 295 143 286 L150 232Z"
        fill="#303c59"/>
      <path d="M151 232 L157 286 Q172 295 184 285 L180 225Z"
        fill="#303c59"/>
      <path d="M115 283 Q108 297 113 302 L147 302 L145 289Z"
        fill="#202333"/>
      <path d="M155 289 L153 302 L190 302 Q193 293 180 283Z"
        fill="#202333"/>

      <!-- Body -->
      <path d="M110 139 Q150 123 190 139 L185 235
        Q150 252 115 235Z" fill="${c.outfit}"/>
      <path d="M110 154 Q95 160 92 204 L103 211
        L125 173Z" fill="${c.outfit}"/>
      <path d="M190 154 Q205 160 208 204 L197 211
        L175 173Z" fill="${c.outfit}"/>

      <!-- Arms -->
      <path d="M95 197 L91 241 Q95 252 106 245 L111 204Z"
        fill="${c.skin}"/>
      <path d="M205 197 L209 241 Q205 252 194 245 L189 204Z"
        fill="${c.skin}"/>

      <!-- Neck -->
      <rect x="137" y="118" width="26" height="31"
        rx="9" fill="${c.skin}"/>

      <!-- Head -->
      <ellipse cx="150" cy="91" rx="39" ry="49" fill="${c.skin}"/>

      <!-- Hair -->
      <path d="M111 88 Q105 35 149 34 Q196 30 190 88
        Q181 65 170 60 Q145 76 116 65Z" fill="${c.hair}"/>
      <path d="M111 83 Q101 102 113 118 L120 89Z"
        fill="${c.hair}"/>
      <path d="M189 82 Q199 103 187 118 L180 89Z"
        fill="${c.hair}"/>

      ${back ? `
        <path d="M111 87 Q107 34 150 34 Q194 34 189 87
          Q185 130 150 137 Q115 130 111 87Z"
          fill="${c.hair}"/>
        <path d="M124 126 Q150 142 176 126"
          fill="${c.hair}"/>
      ` : side ? `
        <ellipse cx="170" cy="91" rx="3" ry="5" fill="#38231c"/>
        <path d="M180 100 L191 104 L180 109" fill="${c.skin}"/>
      ` : `
        <ellipse cx="136" cy="94" rx="3.5" ry="4" fill="#29202a"/>
        <ellipse cx="164" cy="94" rx="3.5" ry="4" fill="#29202a"/>
        <path d="M143 112 Q150 117 157 112"
          stroke="#804b43" stroke-width="2.5" fill="none"
          stroke-linecap="round"/>
      `}

      <!-- Outfit detail -->
      ${back ? `
        <path d="M130 155 L170 155 L168 226 L132 226Z"
          fill="${c.accent}" opacity=".65"/>
      ` : `
        <path d="M139 146 L150 162 L161 146"
          fill="${c.accent}"/>
        <path d="M150 162 L150 226"
          stroke="${c.accent}" stroke-width="3"/>
        <circle cx="150" cy="181" r="3" fill="${c.accent}"/>
        <circle cx="150" cy="199" r="3" fill="${c.accent}"/>
      `}
    </g>
  </svg>`;
}

function render(){
  const list=$("characterList");
  list.innerHTML=characters.map((c,i)=>`
    <div class="character ${i===selected?"selected":""}"
         onclick="selectCharacter(${i})">
      <svg class="mini" viewBox="0 0 300 330">
        ${avatar(c,"front").replace(/<svg[^>]*>|<\/svg>/g,"")}
      </svg>
      <b>${esc(c.name)}</b>
    </div>`).join("");

  const c=current();
  $("stage").innerHTML=avatar(c,currentView)
    .replace(/<svg[^>]*>|<\/svg>/g,"");
  $("charName").value=c.name;
  ["skin","hair","outfit","accent"].forEach(k=>{
    $(k).value=c[k];
  });
}

function selectCharacter(i){
  selected=i;
  render();
}

function updateCharacter(){
  const c=current();
  c.name=$("charName").value||"New Character";
  ["skin","hair","outfit","accent"].forEach(k=>{
    c[k]=$(k).value;
  });
  renderPreview();
  saveLocal();
}

function renderPreview(){
  const c=current();
  $("stage").innerHTML=avatar(c,currentView)
    .replace(/<svg[^>]*>|<\/svg>/g,"");
  $("characterList").innerHTML=characters.map((ch,i)=>`
    <div class="character ${i===selected?"selected":""}"
         onclick="selectCharacter(${i})">
      <svg class="mini" viewBox="0 0 300 330">
        ${avatar(ch).replace(/<svg[^>]*>|<\/svg>/g,"")}
      </svg>
      <b>${esc(ch.name)}</b>
    </div>`).join("");
}

function addCharacter(){
  const c={...current(),id:Date.now(),name:"New Character"};
  characters.push(c);
  selected=characters.length-1;
  saveLocal();
  render();
  $("message").textContent="New character created!";
}

function saveCharacter(){
  updateCharacter();
  saveLocal();
  $("message").textContent="Character saved successfully!";
}

function resetCharacter(){
  const c=current();
  const original=defaults[(selected)%defaults.length];
  c.name=original[0];
  c.skin=original[1];c.hair=original[2];
  c.outfit=original[3];c.accent=original[4];
  render();
  saveLocal();
}

function downloadPNG(){
  const svg=avatar(current(),currentView);
  const blob=new Blob([svg],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement("canvas");
    canvas.width=900;canvas.height=990;
    const ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,900,990);
    ctx.drawImage(img,0,0,900,990);
    const a=document.createElement("a");
    a.download=current().name.replace(/\s+/g,"_")+".png";
    a.href=canvas.toDataURL("image/png");
    a.click();
    URL.revokeObjectURL(url);
  };
  img.src=url;
}

document.querySelectorAll("[data-view]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentView=btn.dataset.view;
    document.querySelectorAll("[data-view]").forEach(b=>
      b.classList.toggle("active",b===btn));
    renderPreview();
  });
});

["charName","skin","hair","outfit","accent"].forEach(id=>{
  $(id).addEventListener("input",updateCharacter);
});

render();
</script>
</body>
</html>
