<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonScene Maker - Create Your Cartoon Story</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
        }
        .logo-area h1 {
            color: #ff6b6b;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .logo-area p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .styles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .style-card {
            background: #f8f9fa;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .style-card:hover, .style-card.selected {
            border-color: #ff6b6b;
            background: #fff5f5;
            transform: translateY(-3px);
        }
        .style-card h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }
        .style-card p {
            font-size: 12px;
            color: #777;
        }
        .start-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .start-btn:hover {
            background: #fa5252;
        }
        /* Modal Popup CSS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            outline: none;
        }
        .modal-content button {
            background: #51cf66;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>🎬 ToonScene Maker</h1>
            <p>Design your own cartoon animation stories!</p>
        </div>

        <div class="styles-grid">
            <div class="style-card selected" onclick="selectStyle(this, '2D Cartoon')">
                <h3>🎨 2D Cartoon</h3>
                <p>Classic flat vibrant style</p>
            </div>
            <div class="style-card" onclick="selectStyle(this, '3D Style')">
                <h3>🧊 3D Render</h3>
                <p>Modern dimensional look</p>
            </div>
            <div class="style-card" onclick="selectStyle(this, 'Chibi Cute')">
                <h3>✨ Chibi Cute</h3>
                <p>Adorable mini characters</p>
            </div>
            <div class="style-card" onclick="selectStyle(this, 'Dark Suspense')">
                <h3>🌙 Dark / Mystery</h3>
                <p>Moody thriller vibes</p>
            </div>
        </div>

        <button class="start-btn" onclick="openPopup()">Create Project 🚀</button>
    </div>

    <!-- Project Name Popup Modal -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <h3>Name Your Project</h3>
            <input type="text" id="projectName" placeholder="e.g., My First Cartoon Story" />
            <button onclick="createProject()">Start Creating 🎨</button>
        </div>
    </div>

    <script>
        let selectedStyle = "2D Cartoon";

        function selectStyle(element, styleName) {
            document.querySelectorAll('.style-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            selectedStyle = styleName;
        }

        function openPopup() {
            document.getElementById('projectModal').style.display = 'flex';
        }

        function createProject() {
            let name = document.getElementById('projectName').value.trim();
            if(!name) {
                alert("Please enter a project name!");
                return;
            }
            // Data save karke Canvas Editor page par redirect karenge
            localStorage.setItem('currentProject', name);
            localStorage.setItem('currentStyle', selectedStyle);
            
            // Yahan hum canvas editor page par jayenge (editor.html)
            window.location.href = "editor.html";
        }
    </script>
</body>
</html>
