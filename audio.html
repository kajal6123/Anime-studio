
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimStudio Audio Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111c;color:white;font-family:Arial}
header{padding:17px;background:#1c1d2d;display:flex;justify-content:space-between;align-items:center}
a{color:#c4b5fd;text-decoration:none}
main{max-width:850px;margin:auto;padding:16px}
.panel{background:#202235;padding:16px;border-radius:15px;margin:14px 0}
h2,h3{margin-top:5px}
input,select{width:100%;padding:12px;margin:7px 0;background:#303249;color:white;border:1px solid #484a63;border-radius:9px}
button{padding:11px 15px;border:0;border-radius:9px;background:#8b5cf6;color:white;margin:5px;cursor:pointer}
button.danger{background:#b83e55}
audio{width:100%;margin-top:10px}
.track{background:#303249;padding:13px;border-radius:11px;margin:10px 0}
small{color:#aaa}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
</style>
</head>
<body>
<header>
<a href="editor.html">← Editor</a>
<b>🎵 Audio Studio</b>
<a href="backgrounds.html">Backgrounds →</a>
</header>
<main>
<div class="panel">
<h2>🎙️ Add Your Audio</h2>
<label>Audio name</label>
<input id="audioName" placeholder="Example: Horror background music">
<label>Audio category</label>
<select id="category">
<option>Voice Over</option>
<option>Dialogue</option>
<option>Background Music</option>
<option>Horror Sound</option>
<option>Sound Effects</option>
<option>Nature Sounds</option>
</select>
<label>Select audio file</label>
<input type="file" id="audioFile" accept="audio/*">
<audio id="player" controls></audio>
<button onclick="saveAudio()">＋ Save Audio</button>
</div>

<div class="panel">
<h3>🎧 My Audio Library</h3>
<div id="library"></div>
</div>

<div class="panel">
<h3>🎬 Add Audio to Scene</h3>
<label>Select Scene</label>
<select id="sceneSelect"></select>
<label>Select Audio</label>
<select id="audioSelect"></select>
<div class="row">
<button onclick="assignAudio()">Add to Scene</button>
<button onclick="showAssignments()">View Assignments</button>
</div>
<div id="assignments"></div>
</div>
</main>

<script>
let db;
let selectedFile=null;
let audioItems=[];

const request=indexedDB.open("AnimStudioAudioDB",1);

request.onupgradeneeded=e=>{
 const database=e.target.result;
 if(!database.objectStoreNames.contains("audio")){
 database.createObjectStore("audio",{keyPath:"id"});
 }
};

request.onsuccess=e=>{
 db=e.target.result;
 loadAudio();
};

request.onerror=()=>alert("Audio storage could not be opened.");

document.getElementById("audioFile").onchange=e=>{
 selectedFile=e.target.files[0]||null;
 const player=document.getElementById("player");
 if(selectedFile){
 player.src=URL.createObjectURL(selectedFile);
 }
};

function saveAudio(){
 if(!db)return alert("Storage is loading. Try again.");
 if(!selectedFile)return alert("Pehle audio file select karo.");

 const item={
 id:Date.now()+Math.random(),
 name:document.getElementById("audioName").value.trim()||selectedFile.name,
 category:document.getElementById("category").value,
 file:selectedFile,
 type:selectedFile.type
 };

 const tx=db.transaction("audio","readwrite");
 tx.objectStore("audio").put(item);

 tx.oncomplete=()=>{
 document.getElementById("audioName").value="";
 document.getElementById("audioFile").value="";
 document.getElementById("player").removeAttribute("src");
 selectedFile=null;
 loadAudio();
 alert("Audio saved!");
 };
 tx.onerror=()=>alert("Audio save nahi hua. Storage space check karo.");
}

function loadAudio(){
 if(!db)return;
 const tx=db.transaction("audio","readonly");
 const req=tx.objectStore("audio").getAll();
 req.onsuccess=()=>{
 audioItems=req.result||[];
 renderLibrary();
 renderSelects();
 };
}

function renderLibrary(){
 const box=document.getElementById("library");
 box.innerHTML="";
 if(!audioItems.length){
 box.textContent="Abhi koi audio upload nahi hai.";
 return;
 }

 audioItems.forEach(item=>{
 const div=document.createElement("div");
 div.className="track";
 const title=document.createElement("b");
 title.textContent=item.name;
 const category=document.createElement("small");
 category.textContent=" • "+item.category;
 const player=document.createElement("audio");
 player.controls=true;
 player.src=URL.createObjectURL(item.file);
 const del=document.createElement("button");
 del.className="danger";
 del.textContent="Delete";
 del.onclick=()=>deleteAudio(item.id);
 div.append(title,category,player,del);
 box.appendChild(div);
 });
}

function renderSelects(){
 const project=JSON.parse(localStorage.getItem("animstudio_project")||'{"scenes":[]}');
 const sceneSelect=document.getElementById("sceneSelect");
 sceneSelect.innerHTML="";
 (project.scenes||[]).forEach((scene,i)=>{
 const opt=document.createElement("option");
 opt.value=i;
 opt.textContent=(i+1)+". "+scene.name;
 sceneSelect.appendChild(opt);
 });

 const audioSelect=document.getElementById("audioSelect");
 audioSelect.innerHTML="";
 audioItems.forEach(item=>{
 const opt=document.createElement("option");
 opt.value=item.id;
 opt.textContent=item.name+" ("+item.category+")";
 audioSelect.appendChild(opt);
 });
}

function assignAudio(){
 const project=JSON.parse(localStorage.getItem("animstudio_project")||'{"scenes":[]}');
 const sceneIndex=Number(document.getElementById("sceneSelect").value);
 const audioId=Number(document.getElementById("audioSelect").value);
 const item=audioItems.find(a=>a.id===audioId);

 if(!project.scenes||!project.scenes[sceneIndex]||!item){
 alert("Scene aur audio dono select karo.");
 return;
 }

 project.scenes[sceneIndex].audio={
 id:item.id,
 name:item.name,
 category:item.category
 };

 localStorage.setItem("animstudio_project",JSON.stringify(project));
 alert("Audio scene ke saath attach ho gaya!");
 showAssignments();
}

function showAssignments(){
 const project=JSON.parse(localStorage.getItem("animstudio_project")||'{"scenes":[]}');
 const box=document.getElementById("assignments");
 box.innerHTML="";
 (project.scenes||[]).forEach((s,i)=>{
 const p=document.createElement("p");
 p.textContent="Scene "+(i+1)+": "+s.name+" — "+(s.audio?s.audio.name:"No audio");
 box.appendChild(p);
 });
}

function deleteAudio(id){
 const tx=db.transaction("audio","readwrite");
 tx.objectStore("audio").delete(id);
 tx.oncomplete=loadAudio;
}

loadAudio();
</script>
</body>
</html>
