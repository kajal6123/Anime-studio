
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimStudio - Animation Studio</title>
<style>
:root{
 --bg:#10121b;--panel:#191d2a;--panel2:#222838;
 --text:#f5f5ff;--muted:#9ba3b8;
 --pink:#ff5c9a;--purple:#8b7cff;--line:#30384b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:15px 16px;display:flex;justify-content:space-between;align-items:center;background:#10121bee;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-size:21px;font-weight:800}.logo span{color:var(--pink)}
button,select,input{font:inherit}
button{background:var(--panel2);color:white;border:1px solid var(--line);border-radius:9px;padding:10px 13px;cursor:pointer}
button.active,.primary{background:linear-gradient(120deg,var(--pink),var(--purple));border:0;color:white;font-weight:bold}
main{max-width:1050px;margin:auto;padding:16px 13px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 13px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}
select,input{width:100%;padding:12px;background:#111521;color:white;border:1px solid var(--line);border-radius:9px}
input[type=range]{padding:0;accent-color:var(--pink)}
.preview{height:350px;background:radial-gradient(ellipse,#30364b,#171b28 75%);border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:280px;height:330px;overflow:visible}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.small{font-size:12px;color:var(--muted);line-height:1.6}
.categories{display:flex;gap:7px;overflow-x:auto;padding:3px 0 13px}
.categories button{white-space:nowrap;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.card{height:145px;background:#141824;border:1px solid var(--line);border-radius:11px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden}
.card.selected{border:2px solid var(--pink)}
.card svg{width:110px;height:120px}
.card span{position:absolute;bottom:7px;left:9px;font-size:11px;font-weight:bold}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#message{font-size:12px;color:#b6a7ff;margin-top:12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:500px){.controls{grid-template-columns:1fr}.preview{height:320px}#stage{height:300px}}
/* Motion engine */
#rig{transform-box:view-box;transform-origin:150px 290px}
#rig.walk .legL{animation:legL .45s infinite alternate}
#rig.walk .legR{animation:legR .45s infinite alternate}
#rig.walk .armL{animation:armL .45s infinite alternate}
#rig.walk .armR{animation:armR .45s infinite alternate}
#rig.run .legL{animation:legL .22s infinite alternate}
#rig.run .legR{animation:legR .22s infinite alternate}
#rig.run .armL{animation:armL .22s infinite alternate}
#rig.run .armR{animation:armR .22s infinite alternate}
#rig.idle{animation:breathe 1.8s infinite ease-in-out}
#rig.jump{animation:jump .8s infinite ease-in-out}
#rig.wave .armR{animation:wave .7s infinite ease-in-out}
#rig.talk .head{animation:talk .25s infinite alternate}
#rig.talk .armR{animation:talkArm .5s infinite alternate}
#rig.sit .legL{transform:rotate(70deg)}
#rig.sit .legR{transform:rotate(-60deg)}
#rig.sit .body{transform:rotate(-5deg)}
#rig.cook .armR{animation:stir .5s infinite alternate}
#rig.cook .armL{animation:stir2 .5s infinite alternate}
#rig.shop .armR{animation:serve .7s infinite alternate}
#rig.shop .armL{animation:serve2 .7s infinite alternate}
#rig.clean .body{animation:bend .8s infinite alternate}
#rig.clean .armR{animation:stir .6s infinite alternate}
#rig.serve .armR{animation:serve .7s infinite alternate}
#rig.write .armR{animation:write .5s infinite alternate}
#rig.dance{animation:dance .5s infinite alternate}
#rig.dance .armR{animation:wave .5s infinite alternate}
#rig.dance .legL{animation:legL .5s infinite alternate}
#rig.dance .legR{animation:legR .5s infinite alternate}
@keyframes legL{to{transform:rotate(28deg)}}
@keyframes legR{to{transform:rotate(-28deg)}}
@keyframes armL{to{transform:rotate(-28deg)}}
@keyframes armR{to{transform:rotate(28deg)}}
@keyframes breathe{50%{transform:translateY(-4px)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-42px)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-110deg)}}
@keyframes talk{to{transform:translateY(3px)}}
@keyframes talkArm{to{transform:rotate(-25deg)}}
@keyframes stir{to{transform:rotate(-55deg)}}
@keyframes stir2{to{transform:rotate(25deg)}}
@keyframes serve{to{transform:rotate(-35deg)}}
@keyframes serve2{to{transform:rotate(25deg)}}
@keyframes bend{to{transform:rotate(8deg)}}
@keyframes write{to{transform:rotate(-35deg)}}
@keyframes dance{to{transform:rotate(10deg) translateY(-8px)}}
</style>
</head>
<body>
<header>
 <div>
  <div class="logo">Anim<span>Studio</span></div>
  <div class="small">Character Animation Studio</div>
 </div>
 <button onclick="location.href='index.html'">← Designer</button>
</header>

<main>
 <div class="panel">
  <h2>1. Choose Your Character</h2>
  <label>Saved character</label>
  <select id="characterSelect"></select>
  <p class="small" id="characterInfo">Loading characters...</p>
 </div>

 <div class="panel">
  <h2>2. Animation Preview</h2>
  <div class="preview" id="preview">
   <svg id="stage" viewBox="0 0 300 330"></svg>
  </div>
  <div class="actions">
   <button onclick="play()">▶ Play</button>
   <button onclick="pause()">Ⅱ Pause</button>
   <button onclick="reset()">↻ Reset</button>
  </div>
  <p class="small" id="status">Choose an animation below.</p>
 </div>

 <div class="panel">
  <h2>3. Animation Gallery</h2>
  <div class="categories">
   <button class="active" data-cat="All">All</button>
   <button data-cat="Positions">Positions</button>
   <button data-cat="Movement">Movement</button>
   <button data-cat="Kitchen">Kitchen</button>
   <button data-cat="Business">Business</button>
   <button data-cat="Daily Life">Daily Life</button>
   <button data-cat="Work">Work</button>
  </div>
  <input id="search" placeholder="Search animation...">
  <div class="grid" id="gallery"></div>
 </div>

 <div class="panel">
  <h2>4. Animation Settings</h2>
  <div class="controls">
   <div>
    <label>Speed: <b id="speedText">1.0x</b></label>
    <input id="speed" type="range" min=".3" max="3" step=".1" value="1">
   </div>
   <div>
    <label>Scene duration: <b id="durationText">3 seconds</b></label>
    <input id="duration" type="range" min="1" max="30" value="3">
   </div>
  </div>
  <div class="actions">
   <button class="primary" onclick="saveAssignment()">Save Animation to Character</button>
  </div>
  <p id="message"></p>
  <p class="small">Your assignments are saved on this device.</p>
 </div>
</main>

<script>
const $=id=>document.getElementById(id);

const starter=[
 ["Aarav","#d99b72","#30201d","#4169a9","#f4bd42"],
 ["Mira","#edbd96","#251b28","#b84f7c","#f4d5a5"],
 ["Kabir","#a96f4d","#171717","#397d69","#e6b64e"],
 ["Tara","#e5aa80","#633a24","#8057c8","#f1c75b"],
 ["Dev","#f0c6a0","#4a3025","#d85b50","#f5d58b"],
 ["Riya","#b97959","#161616","#3685b9","#f1c75b"],
 ["Ishaan","#d49a72","#30251c","#5064c9","#e8b74c"],
 ["Anaya","#efc5a5","#38202a","#e46c9c","#f4cf69"],
 ["Veer","#986345","#201a17","#547a42","#dfb65b"],
 ["Kiara","#dca582","#4a2c20","#8e5ab5","#f3d5a3"]
].map((c,i)=>({id:i+1,name:c[0],skin:c[1],hair:c[2],outfit:c[3],accent:c[4]}));

let characters=[];
let assignments={};
let selectedCharacter=0;
let selectedMotion="idle";
let selectedMotionId="motion_0";
let activeCategory="All";
let speed=1;
let duration=3;

const motions=[
 {id:"motion_0",name:"Standing",cat:"Positions",motion:"idle",object:""},
 {id:"motion_1",name:"Sitting",cat:"Positions",motion:"sit",object:"🪑"},
 {id:"motion_2",name:"Waving",cat:"Positions",motion:"wave",object:""},
 {id:"motion_3",name:"Walking",cat:"Movement",motion:"walk",object:""},
 {id:"motion_4",name:"Running",cat:"Movement",motion:"run",object:""},
 {id:"motion_5",name:"Jumping",cat:"Movement",motion:"jump",object:""},
 {id:"motion_6",name:"Talking",cat:"Daily Life",motion:"talk",object:"💬"},
 {id:"motion_7",name:"Cooking Food",cat:"Kitchen",motion:"cook",object:"🍳"},
 {id:"motion_8",name:"Cutting Vegetables",cat:"Kitchen",motion:"cook",object:"🥕"},
 {id:"motion_9",name:"Serving Food",cat:"Kitchen",motion:"serve",object:"🍽️"},
 {id:"motion_10",name:"Washing Dishes",cat:"Kitchen",motion:"clean",object:"🫧"},
 {id:"motion_11",name:"Shopkeeper",cat:"Business",motion:"shop",object:"🏪"},
 {id:"motion_12",name:"Selling Items",cat:"Business",motion:"shop",object:"🛍️"},
 {id:"motion_13",name:"Taking Payment",cat:"Business",motion:"serve",object:"💵"},
 {id:"motion_14",name:"Customer Shopping",cat:"Business",motion:"walk",object:"🛒"},
 {id:"motion_15",name:"Cleaning Floor",cat:"Daily Life",motion:"clean",object:"🧹"},
 {id:"motion_16",name:"Writing",cat:"Work",motion:"write",object:"✍️"},
 {id:"motion_17",name:"Painting",cat:"Work",motion:"write",object:"🎨"},
 {id:"motion_18",name:"Dancing",cat:"Daily Life",motion:"dance",object:"🎵"}
];

function readCharacters(){
 try{
  const data=JSON.parse(localStorage.getItem("animstudio_characters"));
  if(Array.isArray(data)&&data.length)return data;
  if(data&&Array.isArray(data.characters)&&data.characters.length)return data.characters;
 }catch(e){}
 return starter;
}

function readAssignments(){
 try{
  return JSON.parse(localStorage.getItem("animstudio_character_animations"))||{};
 }catch(e){return {}}
}

function character(){
 return characters[selectedCharacter]||starter[0];
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function getSavedAssignment(){
 const c=character();
 return assignments[String(c.id)]||assignments[String(selectedCharacter)]||null;
}

function renderCharacterOptions(){
 $("characterSelect").innerHTML=characters.map((c,i)=>
  `<option value="${i}">${escapeHTML(c.name||"Character "+(i+1))}</option>`
 ).join("");

 const saved=getSavedAssignment();
 if(saved){
  const found=motions.find(m=>m.id===saved.motionId)||
   motions.find(m=>m.motion===saved.motion);
  if(found){
   selectedMotion=found.motion;
   selectedMotionId=found.id;
   speed=Number(saved.speed)||1;
   duration=Number(saved.duration)||3;
  }
 }
 $("speed").value=speed;
 $("duration").value=duration;
 updateSettingLabels();
 renderPreview();
}

function rigSVG(c,motion,object=""){
 const skin=c.skin||"#d99b72";
 const hair=c.hair||"#30201d";
 const outfit=c.outfit||"#4169a9";
 const accent=c.accent||"#f4bd42";

 return `
 <svg viewBox="0 0 300 330" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="150" cy="303" rx="61" ry="9" fill="#080a12" opacity=".5"/>
  <g id="rig" class="${motion}">
   <!-- Legs -->
   <g class="legL" style="transform-origin:119px 225px">
    <path d="M119 225 L116 286" stroke="#303c59" stroke-width="25" stroke-linecap="round" fill="none"/>
    <path d="M116 286 L113 299 L143 299" stroke="#202333" stroke-width="12" stroke-linecap="round" fill="none"/>
   </g>
   <g class="legR" style="transform-origin:180px 225px">
    <path d="M180 225 L184 286" stroke="#303c59" stroke-width="25" stroke-linecap="round" fill="none"/>
    <path d="M184 286 L187 299 L157 299" stroke="#202333" stroke-width="12" stroke-linecap="round" fill="none"/>
   </g>

   <!-- Body -->
   <g class="body" style="transform-origin:150px 139px">
    <path d="M110 139 Q150 123 190 139 L185 235 Q150 252 115 235Z" fill="${outfit}"/>
    <path d="M139 146 L150 162 L161 146" fill="${accent}"/>
    <path d="M150 162 L150 226" stroke="${accent}" stroke-width="3"/>
    <circle cx="150" cy="181" r="3" fill="${accent}"/>
    <circle cx="150" cy="199" r="3" fill="${accent}"/>
   </g>

   <!-- Arms -->
   <g class="armL" style="transform-origin:105px 158px">
    <path d="M110 154 Q95 160 92 204 L103 211 L125 173Z" fill="${outfit}"/>
    <path d="M95 197 L91 241" stroke="${skin}" stroke-width="14" stroke-linecap="round"/>
    <circle cx="91" cy="243" r="8" fill="${skin}"/>
   </g>
   <g class="armR" style="transform-origin:195px 158px">
    <path d="M190 154 Q205 160 208 204 L197 211 L175 173Z" fill="${outfit}"/>
    <path d="M205 197 L209 241" stroke="${skin}" stroke-width="14" stroke-linecap="round"/>
    <circle cx="209" cy="243" r="8" fill="${skin}"/>
   </g>

   <!-- Neck -->
   <rect x="137" y="118" width="26" height="31" rx="9" fill="${skin}"/>

   <!-- Head -->
   <g class="head" style="transform-origin:150px 91px">
    <ellipse cx="150" cy="91" rx="39" ry="49" fill="${skin}"/>
    <path d="M111 88 Q105 35 149 34 Q196 30 190 88 Q181 65 170 60 Q145 76 116 65Z" fill="${hair}"/>
    <path d="M111 83 Q101 102 113 118 L120 89Z" fill="${hair}"/>
    <path d="M189 82 Q199 103 187 118 L180 89Z" fill="${hair}"/>
    <ellipse cx="136" cy="94" rx="3.5" ry="4" fill="#29202a"/>
    <ellipse cx="164" cy="94" rx="3.5" ry="4" fill="#29202a"/>
    <path d="M143 112 Q150 117 157 112" stroke="#804b43" stroke-width="2.5" fill="none" stroke-linecap="round"/>
   </g>

   <!-- Props -->
   ${motion==="cook"?`
    <g class="prop">
     <path d="M210 190 L266 190 L259 220 L217 220Z" fill="#7d8497" stroke="#c4cad8" stroke-width="3"/>
     <path d="M260 195 L282 187" stroke="#c4cad8" stroke-width="6" stroke-linecap="round"/>
     <path d="M220 183 Q237 169 254 183" fill="#ffb15c" opacity=".7"/>
    </g>`:""}

   ${motion==="write"?`
    <g class="prop">
     <rect x="210" y="215" width="58" height="36" rx="3" fill="#f3e6c8"/>
     <path d="M220 225 H256 M220 234 H250" stroke="#a6a0a0" stroke-width="2"/>
     <path d="M205 183 L229 210" stroke="${accent}" stroke-width="5" stroke-linecap="round"/>
    </g>`:""}

   ${motion==="shop"||motion==="serve"?`
    <g class="prop">
     <path d="M211 207 H278 V249 H211Z" fill="#9b6848"/>
     <path d="M211 207 H278 V217 H211Z" fill="#d7a36d"/>
     <rect x="226" y="185" width="25" height="19" rx="3" fill="${accent}"/>
    </g>`:""}

   ${motion==="clean"?`
    <g class="prop">
     <path d="M210 178 L260 260" stroke="#c99b64" stroke-width="6" stroke-linecap="round"/>
     <path d="M250 249 L276 269 L257 278 L238 257Z" fill="#8b7cff"/>
    </g>`:""}

   ${motion==="sit"?`
    <g class="prop">
     <path d="M91 226 H205 V237 H91Z" fill="#a27655"/>
     <path d="M99 237 V293 M195 237 V293" stroke="#a27655" stroke-width="8"/>
    </g>`:""}
   ${object&&motion!=="cook"&&motion!=="write"&&motion!=="shop"&&motion!=="serve"&&motion!=="clean"&&motion!=="sit"?`
    <text x="238" y="150" font-size="27" text-anchor="middle">${object}</text>`:""}
  </g>
 </svg>`;
}

function renderPreview(){
 const c=character();
 const m=motions.find(x=>x.id===selectedMotionId)||motions[0];
 $("stage").outerHTML=rigSVG(c,selectedMotion,m.object).replace("<svg ","<svg id='stage' ");
 $("characterInfo").textContent="Selected: "+(c.name||"Character")+" · "+m.name;
 applySpeed();
}

function renderGallery(){
 const q=$("search").value.toLowerCase();
 const filtered=motions.filter(m=>
  (activeCategory==="All"||m.cat===activeCategory)&&
  (m.name.toLowerCase().includes(q)||m.cat.toLowerCase().includes(q))
 );
 $("gallery").innerHTML=filtered.map(m=>
  `<div class="card ${selectedMotionId===m.id?"selected":""}" onclick="chooseMotion('${m.id}')">
   ${rigSVG(character(),m.motion,m.object)}
   <span>${m.name}</span>
  </div>`
 ).join("");
}

function chooseMotion(id){
 const m=motions.find(x=>x.id===id);
 if(!m)return;
 selectedMotion=m.motion;
 selectedMotionId=m.id;
 renderPreview();
 renderGallery();
 $("status").textContent="Selected: "+m.name;
}

function applySpeed(){
 const stage=$("stage");
 if(!stage)return;
 stage.style.animationDuration=(1/speed)+"s";
 stage.querySelectorAll("*").forEach(el=>{
  el.style.animationDuration=(1/speed)+"s";
 });
}

function play(){
 const stage=$("stage");
 stage.getAnimations().forEach(a=>a.play());
 stage.querySelectorAll("*").forEach(el=>el.getAnimations().forEach(a=>a.play()));
 $("status").textContent="▶ Playing animation";
}

function pause(){
 const stage=$("stage");
 stage.getAnimations().forEach(a=>a.pause());
 stage.querySelectorAll("*").forEach(el=>el.getAnimations().forEach(a=>a.pause()));
 $("status").textContent="Ⅱ Animation paused";
}

function reset(){
 renderPreview();
 $("status").textContent="↻ Animation reset";
}

function updateSettingLabels(){
 $("speedText").textContent=speed.toFixed(1)+"x";
 $("durationText").textContent=duration+" seconds";
}

function saveAssignment(){
 const c=character();
 const m=motions.find(x=>x.id===selectedMotionId)||motions[0];
 assignments[String(c.id??selectedCharacter)]={
  characterName:c.name,
  motionId:m.id,
  motion:m.motion,
  motionName:m.name,
  speed,
  duration
 };
 localStorage.setItem("animstudio_character_animations",JSON.stringify(assignments));
 $("message").textContent="✓ "+m.name+" saved for "+(c.name||"Character")+"!";
}

$("characterSelect").addEventListener("change",e=>{
 selectedCharacter=Number(e.target.value);
 const saved=getSavedAssignment();
 if(saved){
  const m=motions.find(x=>x.id===saved.motionId)||motions.find(x=>x.motion===saved.motion);
  if(m){selectedMotion=m.motion;selectedMotionId=m.id;}
 }
 renderPreview();
 renderGallery();
 $("message").textContent="";
});

$("search").addEventListener("input",renderGallery);

document.querySelectorAll("[data-cat]").forEach(btn=>{
 btn.addEventListener("click",()=>{
  activeCategory=btn.dataset.cat;
  document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("active",b===btn));
  renderGallery();
 });
});

$("speed").addEventListener("input",e=>{
 speed=Number(e.target.value);
 updateSettingLabels();
 applySpeed();
});

$("duration").addEventListener("input",e=>{
 duration=Number(e.target.value);
 updateSettingLabels();
});

characters=readCharacters();
assignments=readAssignments();
renderCharacterOptions();
renderGallery();
updateSettingLabels();
</script>
</body>
</html>
