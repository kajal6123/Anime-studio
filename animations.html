
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimStudio - Character Animation</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101113;color:#fff;font-family:Arial,sans-serif}
header{padding:15px;display:flex;justify-content:space-between;align-items:center;background:#191a1d;border-bottom:1px solid #303136;position:sticky;top:0;z-index:5}
.logo{font-size:21px;font-weight:bold}.logo span{color:#ff5c9a}
button,select,input{font:inherit}
button{background:#292a30;color:white;border:1px solid #41434a;border-radius:9px;padding:10px 13px;cursor:pointer}
button.active,.primary{background:#805eea;border-color:#805eea}
main{max-width:950px;margin:auto;padding:15px}
.panel{background:#191a1d;border:1px solid #303136;border-radius:14px;padding:15px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 13px}
label{font-size:12px;color:#aaa;display:block;margin-bottom:7px}
select,input{width:100%;padding:12px;background:#202125;color:white;border:1px solid #41434a;border-radius:9px}
.preview{height:310px;background:radial-gradient(ellipse,#303442,#17181c 75%);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:210px;height:270px;overflow:visible}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.card{height:125px;background:#141518;border:1px solid #303136;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.card.selected{border:2px solid #9b80ff}
.card svg{width:85px;height:95px}
.card span{position:absolute;bottom:7px;left:8px;font-size:11px}
.categories{display:flex;gap:7px;overflow:auto;padding:3px 0 13px}
.categories button{white-space:nowrap;font-size:12px}
.small{font-size:12px;color:#999;line-height:1.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
#message{color:#a99aff;font-size:12px;margin-top:12px}
input[type=range]{padding:0;accent-color:#9b80ff}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:500px){.controls{grid-template-columns:1fr}}
/* Character animation rig */
#rig{transform-origin:50% 90%}
#rig.walk .legL{animation:walkL .45s infinite alternate}
#rig.walk .legR{animation:walkR .45s infinite alternate}
#rig.walk .armL{animation:armL .45s infinite alternate}
#rig.walk .armR{animation:armR .45s infinite alternate}
#rig.run .legL{animation:walkL .22s infinite alternate}
#rig.run .legR{animation:walkR .22s infinite alternate}
#rig.run .armL{animation:armL .22s infinite alternate}
#rig.run .armR{animation:armR .22s infinite alternate}
#rig.idle{animation:breathe 1.8s infinite ease-in-out}
#rig.jump{animation:jump .8s infinite ease-in-out}
#rig.wave .armR{animation:wave .7s infinite ease-in-out}
#rig.talk .head{animation:talk .25s infinite alternate}
#rig.talk .armR{animation:talkArm .5s infinite alternate}
#rig.sit .legL{transform:rotate(75deg)}
#rig.sit .legR{transform:rotate(-65deg)}
#rig.sit .body{transform:rotate(-5deg)}
#rig.cook .armR{animation:stir .5s infinite alternate}
#rig.cook .armL{animation:stir2 .5s infinite alternate}
#rig.shop .armR{animation:serve .7s infinite alternate}
#rig.shop .armL{animation:serve2 .7s infinite alternate}
#rig.clean .body{animation:bend .8s infinite alternate}
#rig.clean .armR{animation:stir .6s infinite alternate}
#rig.serve .armR{animation:serve .7s infinite alternate}
#rig.write .armR{animation:stir .5s infinite alternate}
#rig.dance{animation:dance .5s infinite alternate}
#rig.dance .armR{animation:wave .5s infinite alternate}
#rig.dance .legL{animation:walkL .5s infinite alternate}
#rig.dance .legR{animation:walkR .5s infinite alternate}
@keyframes walkL{to{transform:rotate(28deg)}}
@keyframes walkR{to{transform:rotate(-28deg)}}
@keyframes armL{to{transform:rotate(-28deg)}}
@keyframes armR{to{transform:rotate(28deg)}}
@keyframes breathe{50%{transform:translateY(-4px)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-45px)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-110deg)}}
@keyframes talk{to{transform:translateY(3px)}}
@keyframes talkArm{to{transform:rotate(-25deg)}}
@keyframes stir{to{transform:rotate(-55deg)}}
@keyframes stir2{to{transform:rotate(25deg)}}
@keyframes serve{to{transform:rotate(-35deg)}}
@keyframes serve2{to{transform:rotate(25deg)}}
@keyframes bend{to{transform:rotate(8deg)}}
@keyframes dance{to{transform:rotate(10deg) translateY(-8px)}}
</style>
</head>
<body>

<header>
 <div class="logo">Anim<span>Studio</span></div>
 <button onclick="location.href='index.html'">Character Designer</button>
</header>

<main>

<div class="panel">
 <h2>1. Choose Your Character</h2>
 <label>Select a saved character</label>
 <select id="characterSelect"></select>
 <p class="small" id="characterInfo">Select a character to begin.</p>
</div>

<div class="panel">
 <h2>2. Character Animation Preview</h2>
 <div class="preview">
  <svg id="stage" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg"></svg>
 </div>
 <div class="actions">
  <button onclick="play()">▶ Play</button>
  <button onclick="pause()">Ⅱ Pause</button>
  <button onclick="reset()">↻ Reset</button>
 </div>
 <p class="small" id="status">Choose an animation below.</p>
</div>

<div class="panel">
 <h2>3. Select Animation</h2>
 <div class="categories" id="categories">
  <button class="active" data-cat="All">All</button>
  <button data-cat="Positions">Positions</button>
  <button data-cat="Movement">Movement</button>
  <button data-cat="Kitchen">Kitchen</button>
  <button data-cat="Business">Business</button>
  <button data-cat="Daily Life">Daily Life</button>
  <button data-cat="Work">Work</button>
 </div>
 <input id="search" placeholder="Search animation...">
 <div style="height:12px"></div>
 <div class="grid" id="gallery"></div>
</div>

<div class="panel">
 <h2>4. Animation Settings</h2>
 <div class="controls">
  <div>
   <label>Speed: <b id="speedText">1.0x</b></label>
   <input id="speed" type="range" min=".3" max="3" step=".1" value="1">
  </div>
  <div>
   <label>Duration: <b id="durationText">3 seconds</b></label>
   <input id="duration" type="range" min="1" max="15" value="3">
  </div>
 </div>
 <div class="actions">
  <button class="primary" onclick="saveAssignment()">Save Animation to Character</button>
 </div>
 <p id="message"></p>
 <p class="small">
  Saved assignments are stored on this device. The selected character
  and animation can be loaded again from this page.
 </p>
</div>

</main>

<script>
const $=id=>document.getElementById(id);

const starter=[
 {name:"Aarav",skin:"#d99b72",hair:"#30201d",outfit:"#4169a9",accent:"#f4bd42"},
 {name:"Mira",skin:"#edbd96",hair:"#251b28",outfit:"#b84f7c",accent:"#f4d5a5"},
 {name:"Kabir",skin:"#a96f4d",hair:"#171717",outfit:"#397d69",accent:"#e6b64e"},
 {name:"Tara",skin:"#e5aa80",hair:"#633a24",outfit:"#8057c8",accent:"#f1c75b"},
 {name:"Dev",skin:"#f0c6a0",hair:"#4a3025",outfit:"#d85b50",accent:"#f5d58b"},
 {name:"Riya",skin:"#b97959",hair:"#161616",outfit:"#3685b9",accent:"#f1c75b"},
 {name:"Ishaan",skin:"#d49a72",hair:"#30251c",outfit:"#5064c9",accent:"#e8b74c"},
 {name:"Anaya",skin:"#efc5a5",hair:"#38202a",outfit:"#e46c9c",accent:"#f4cf69"},
 {name:"Veer",skin:"#986345",hair:"#201a17",outfit:"#547a42",accent:"#dfb65b"},
 {name:"Kiara",skin:"#dca582",hair:"#4a2c20",outfit:"#8e5ab5",accent:"#f3d5a3"}
];

let characters=[];
let assignments={};
let selectedCharacter=0;
let selectedMotion="idle";
let activeCategory="All";
let speed=1;
let duration=3;
let isPaused=false;

const motions=[
 ["Standing","Positions","idle","A natural standing pose.",""],
 ["Sitting","Positions","sit","Sitting on a chair.","🪑"],
 ["Waving","Positions","wave","Waving a hand.",""],
 ["Walking","Movement","walk","Walking cycle.",""],
 ["Running","Movement","run","Running cycle.",""],
 ["Jumping","Movement","jump","Jumping movement.",""],
 ["Talking","Daily Life","talk","Talking to someone.","💬"],
 ["Cooking Food","Kitchen","cook","Cooking with a pan and spoon.","🍳"],
 ["Cutting Vegetables","Kitchen","cook","Preparing vegetables.","🥕"],
 ["Serving Food","Kitchen","serve","Serving food to a customer.","🍽️"],
 ["Washing Dishes","Kitchen","clean","Washing dishes.","🫧"],
 ["Shopkeeper","Business","shop","Standing behind a shop counter.","🏪"],
 ["Selling Items","Business","shop","Handing an item to a customer.","🛍️"],
 ["Taking Payment","Business","shop","Receiving payment at the counter.","💵"],
 ["Customer Shopping","Business","walk","Shopping in a store.","🛒"],
 ["Cleaning Floor","Daily Life","clean","Sweeping the floor.","🧹"],
 ["Writing","Work","write","Writing on paper.","✍️"],
 ["Painting","Work","write","Painting a surface.","🎨"],
 ["Dancing","Daily Life","dance","Dancing movement.","🎵"]
].map((m,i)=>({id:"motion_"+i,name:m[0],cat:m[1],motion:m[2],desc:m[3],object:m[4]}));

try{
 const data=JSON.parse(localStorage.getItem("animstudio_characters"));
 characters=Array.isArray(data)&&data.length?data:starter;
}catch(e){characters=starter}

try{
 assignments=JSON.parse(localStorage.getItem("animstudio_character_animations"))||{};
}catch(e){assignments={}}

function character(){
 return characters[selectedCharacter]||starter[0];
}

function renderCharacterOptions(){
 $("characterSelect").innerHTML=characters.map((c,i)=>
  `<option value="${i}">${escapeHTML(c.name||"Character "+(i+1))}</option>`
 ).join("");

 const saved=assignments[String(selectedCharacter)];
 if(saved){
  const found=motions.find(m=>m.id===saved.motion);
  if(found){
   selectedMotion=found.motion;
   speed=saved.speed||1;
   duration=saved.duration||3;
   $("speed").value=speed;
   $("duration").value=duration;
   $("speedText").textContent=speed.toFixed(1)+"x";
   $("durationText").textContent=duration+" seconds";
  }
 }
 renderPreview();
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function rigSVG(c,motion,object=""){
 return `
 <svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="100" cy="248" rx="48" ry="7" fill="#08090e" opacity=".5"/>
  <g id="rig" class="${motion}">
   ${object?`<text x="145" y="143" font-size="27">${object}</text>`:""}

   <!-- Legs -->
   <g class="legL" style="transform-origin:88px 174px">
    <path d="M88 174 L83 226 L78 241" stroke="${c.outfit||"#4169a9"}" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M78 241 L61 244" stroke="#eee" stroke-width="9" stroke-linecap="round"/>
   </g>
   <g class="legR" style="transform-origin:112px 174px">
    <path d="M112 174 L117 226 L122 241" stroke="${c.outfit||"#4169a9"}" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M122 241 L139 244" stroke="#eee" stroke-width="9" stroke-linecap="round"/>
   </g>

   <!-- Body -->
   <g class="body" style="transform-origin:100px 104px">
    <path d="M75 96 Q100 84 125 96 L129 177 Q100 188 71 177Z" fill="${c.outfit||"#4169a9"}"/>
    <path d="M89 98 L100 115 L111 98" fill="${c.accent||"#f4bd42"}"/>
   </g>

   <!-- Arms -->
   <g class="armL" style="transform-origin:78px 105px">
    <path d="M78 105 L60 137 L59 163" stroke="${c.skin||"#d99b72"}" stroke-width="12" stroke-linecap="round" fill="none"/>
   </g>
   <g class="armR" style="transform-origin:122px 105px">
    <path d="M122 105 L140 137 L141 163" stroke="${c.skin||"#d99b72"}" stroke-width="12" stroke-linecap="round" fill="none"/>
   </g>

   <!-- Head -->
   <g class="head" style="transform-origin:100px 68px">
    <rect x="91" y="82" width="18" height="18" rx="7" fill="${c.skin||"#d99b72"}"/>
    <circle cx="100" cy="58" r="29" fill="${c.skin||"#d99b72"}"/>
    <path d="M72 58 Q70 25 101 27 Q132 27 128 59 Q116 42 100 44 Q83 49 72 58" fill="${c.hair||"#30201d"}"/>
    <circle cx="90" cy="61" r="2.5" fill="#28202a"/>
    <circle cx="110" cy="61" r="2.5" fill="#28202a"/>
    <path d="M94 74 Q100 79 106 74" fill="none" stroke="#75483d" stroke-width="2"/>
   </g>
  </g>
 </svg>`;
}

function renderPreview(){
 const c=character();
 const m=motions.find(x=>x.motion===selectedMotion)||motions[0];
 $("stage").outerHTML=rigSVG(c,selectedMotion,m.object).replace("<svg ","<svg id='stage' ");
 $("characterInfo").textContent="Selected character: "+c.name;
 applySpeed();
}

function renderGallery(){
 const q=$("search").value.toLowerCase();
 const filtered=motions.filter(m=>
  (activeCategory==="All"||m.cat===activeCategory)&&
  (m.name.toLowerCase().includes(q)||m.cat.toLowerCase().includes(q))
 );

 $("gallery").innerHTML=filtered.map(m=>{
  const c=character();
  return `<div class="card ${selectedMotion===m.motion?"selected":""}"
   onclick="chooseMotion('${m.id}')">
   ${rigSVG(c,m.motion,m.object)}
   <span>${m.name}</span>
  </div>`;
 }).join("");
}

function chooseMotion(id){
 const m=motions.find(x=>x.id===id);
 if(!m)return;
 selectedMotion=m.motion;
 isPaused=false;
 renderPreview();
 renderGallery();
 $("status").textContent="Selected animation: "+m.name;
}

function applySpeed(){
 const stage=$("stage");
 if(!stage)return;
 stage.style.animationDuration=(1/speed)+"s";
 stage.querySelectorAll("*").forEach(el=>{
  el.style.animationDuration=(1/speed)+"s";
 });
}

function play(){
 isPaused=false;
 const stage=$("stage");
 stage.getAnimations().forEach(a=>a.play());
 stage.querySelectorAll("*").forEach(el=>el.getAnimations().forEach(a=>a.play()));
 $("status").textContent="Playing animation.";
}

function pause(){
 const stage=$("stage");
 stage.getAnimations().forEach(a=>a.pause());
 stage.querySelectorAll("*").forEach(el=>el.getAnimations().forEach(a=>a.pause()));
 isPaused=true;
 $("status").textContent="Animation paused.";
}

function reset(){
 renderPreview();
 $("status").textContent="Animation reset.";
}

function saveAssignment(){
 const c=character();
 const m=motions.find(x=>x.motion===selectedMotion)||motions[0];

 assignments[String(selectedCharacter)]={
  characterName:c.name,
  motion:m.motion,
  motionName:m.name,
  speed:speed,
  duration:duration
 };

 localStorage.setItem("animstudio_character_animations",JSON.stringify(assignments));
 $("message").textContent="✓ "+m.name+" saved for "+c.name+"!";
}

$("characterSelect").addEventListener("change",e=>{
 selectedCharacter=Number(e.target.value);
 renderCharacterOptions();
 renderGallery();
 $("status").textContent="Character changed.";
});

$("search").addEventListener("input",renderGallery);

document.querySelectorAll("[data-cat]").forEach(btn=>{
 btn.addEventListener("click",()=>{
  activeCategory=btn.dataset.cat;
  document.querySelectorAll("[data-cat]").forEach(b=>
   b.classList.toggle("active",b===btn));
  renderGallery();
 });
});

$("speed").addEventListener("input",e=>{
 speed=Number(e.target.value);
 $("speedText").textContent=speed.toFixed(1)+"x";
 applySpeed();
});

$("duration").addEventListener("input",e=>{
 duration=Number(e.target.value);
 $("durationText").textContent=duration+" seconds";
});

renderCharacterOptions();
renderGallery();
</script>
</body>
</html>
