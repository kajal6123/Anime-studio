
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimStudio - My Projects</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111c;color:white;font-family:Arial}
header{padding:18px;background:#202235;display:flex;justify-content:space-between}
a{color:#c4b5fd;text-decoration:none}
main{max-width:800px;margin:auto;padding:16px}
.panel,.project{background:#202235;padding:16px;border-radius:14px;margin:13px 0}
input{width:100%;padding:13px;background:#303249;color:white;border:1px solid #555;border-radius:9px}
button{padding:11px 14px;border:0;border-radius:9px;background:#8b5cf6;color:white;margin:5px 3px}
.danger{background:#b83e55}
small{color:#aaa}
.project h3{margin:5px 0}
</style>
</head>
<body>
<header>
<a href="dashboard.html">← Dashboard</a>
<b>📁 My Projects</b>
<a href="editor.html">Editor →</a>
</header>
<main>
<h2>Your Story Projects</h2>

<div class="panel">
<h3>＋ Create New Project</h3>
<input id="projectName" placeholder="Enter your story name">
<button onclick="createProject()">Create Project</button>
</div>

<div id="list"></div>
</main>

<script>
const KEY="animstudio_projects";
const ACTIVE="animstudio_project";

function getProjects(){
try{return JSON.parse(localStorage.getItem(KEY))||[]}
catch(e){return []}
}

function saveProjects(items){
localStorage.setItem(KEY,JSON.stringify(items));
}

function createProject(){
const name=document.getElementById("projectName").value.trim();
if(!name)return alert("Project ka naam likho.");

const projects=getProjects();
const project={
id:Date.now().toString(),
name:name,
ratio:"9:16",
scenes:[],
created:new Date().toLocaleDateString()
};

projects.push(project);
saveProjects(projects);
document.getElementById("projectName").value="";
render();
}

function openProject(id){
const project=getProjects().find(p=>p.id===id);
if(!project)return;
localStorage.setItem(ACTIVE,JSON.stringify(project));
location.href="editor.html";
}

function duplicateProject(id){
const projects=getProjects();
const original=projects.find(p=>p.id===id);
if(!original)return;

const copy=JSON.parse(JSON.stringify(original));
copy.id=Date.now().toString();
copy.name=original.name+" Copy";
copy.created=new Date().toLocaleDateString();
projects.push(copy);
saveProjects(projects);
render();
}

function deleteProject(id){
if(!confirm("Is project ko delete karna hai?"))return;
saveProjects(getProjects().filter(p=>p.id!==id));
render();
}

function render(){
const box=document.getElementById("list");
const projects=getProjects();
box.innerHTML="";

if(!projects.length){
box.textContent="Abhi koi project nahi hai. Apni pehli story create karo!";
return;
}

projects.forEach(p=>{
const div=document.createElement("div");
div.className="project";

const heading=document.createElement("h3");
heading.textContent="🎬 "+p.name;

const info=document.createElement("small");
const scenes=p.scenes||[];
const duration=scenes.reduce((n,s)=>n+(Number(s.duration)||0),0);
info.textContent=scenes.length+" scenes • "+duration+" seconds • "+(p.created||"");

const open=document.createElement("button");
open.textContent="Open Project";
open.onclick=()=>openProject(p.id);

const duplicate=document.createElement("button");
duplicate.textContent="Duplicate";
duplicate.onclick=()=>duplicateProject(p.id);

const del=document.createElement("button");
del.className="danger";
del.textContent="Delete";
del.onclick=()=>deleteProject(p.id);

div.append(heading,info,document.createElement("br"),open,duplicate,del);
box.appendChild(div);
});
}

render();
</script>
</body>
</html>
