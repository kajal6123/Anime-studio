
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimStudio - Video Export</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101322;color:white;font-family:Arial,sans-serif}
header{background:#191f35;padding:16px;font-size:20px;font-weight:bold}
main{max-width:850px;margin:auto;padding:12px}
.panel{background:#191f35;border:1px solid #303953;border-radius:14px;padding:14px;margin-bottom:13px}
button,select{padding:11px;border:0;border-radius:9px;background:#7657ed;color:white;font-weight:bold}
button{cursor:pointer}
.secondary{background:#303953}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
label{display:block;color:#bac4df;font-size:13px;margin:12px 0 6px}
select{width:100%}
canvas{display:block;max-width:100%;max-height:65vh;margin:auto;background:#222;border-radius:8px}
#status{font-size:13px;color:#c4cbea}
progress{width:100%;height:15px}
.scene{padding:9px;background:#252d49;border-radius:8px;margin:6px 0;font-size:13px}
</style>
</head>
<body>
<header>🎞️ AnimStudio Video Export</header>
<main>
<section class="panel">
 <b>Video Preview</b>
 <canvas id="preview" width="720" height="1280"></canvas>
 <div class="row" style="margin-top:12px">
  <button onclick="playPreview()">▶ Preview Story</button>
  <button class="secondary" onclick="stopPreview()">Stop</button>
 </div>
</section>

<section class="panel">
 <b>Export Settings</b>
 <label>Video Ratio</label>
 <select id="ratio" onchange="resizeCanvas()">
  <option value="9:16">9:16 - Shorts / Reels</option>
  <option value="16:9">16:9 - YouTube</option>
  <option value="1:1">1:1 - Square</option>
  <option value="4:5">4:5 - Portrait</option>
 </select>
 <label>Frames Per Second</label>
 <select id="fps">
  <option value="24">24 FPS</option>
  <option value="30" selected>30 FPS</option>
 </select>
 <label>Video Quality</label>
 <select id="quality">
  <option value="2000000">Standard</option>
  <option value="4000000" selected>High</option>
  <option value="6000000">Very High</option>
 </select>
 <label>Scene Transition</label>
 <select id="transition">
  <option value="cut">Cut</option>
  <option value="fade">Fade to black</option>
 </select>
 <div class="row" style="margin-top:12px">
  <button onclick="exportVideo()">⬇ Export Video</button>
  <button class="secondary" onclick="loadProject()">Reload Project</button>
 </div>
 <p id="status">Ready to export.</p>
 <progress id="progress" value="0" max="100"></progress>
</section>

<section class="panel">
 <b>📚 Project Scenes</b>
 <div id="sceneList"></div>
 <p class="small">Scenes are exported in the same order as your saved project.</p>
</section>
</main>

<script src="rig.js"></script>
<script>
"use strict";

const canvas=document.getElementById("preview");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let project={scenes:[]};
let characters=[];
let assetImages={};
let previewRunning=false;
let previewToken=0;
let exporting=false;

const backgrounds={
 village:["#8ed5f4","#d6f4ff","#78b75b"],
 city:["#8bc9ec","#d5edff","#777d91"],
 jungle:["#164b38","#347b4c","#173b2c"],
 horror:["#11172b","#34334b","#11121c"],
 kitchen:["#f6d7a5","#f4e6ca","#b98d62"],
 room:["#9bc4d9","#e8d8c4","#a77b64"],
 school:["#9bd8f1","#f5e6c9","#77a36b"],
 sky:["#42a5f5","#c6efff","#74c6ef"]
};

function setStatus(message){$("status").textContent=message;}

function resizeCanvas(){
 const sizes={
  "9:16":[720,1280],
  "16:9":[1280,720],
  "1:1":[900,900],
  "4:5":[800,1000]
 };
 const size=sizes[$("ratio").value];
 canvas.width=size[0];canvas.height=size[1];
 drawScene(project.scenes[0],0);
}

function loadCharacters(){
 try{
  characters=JSON.parse(localStorage.getItem("animstudio_characters")||"[]");
 }catch(e){characters=[];}
}

function loadProject(){
 try{
  const saved=JSON.parse(localStorage.getItem("animstudio_project")||"null");
  if(!saved||!Array.isArray(saved.scenes)||!saved.scenes.length){
   setStatus("Project nahi mila. Pehle Editor mein project save karo.");
   return;
  }
  project=saved;
  project.scenes.forEach(s=>{if(!s.objects)s.objects=[];});
  loadCharacters();
  showScenes();
  resizeCanvas();
  setStatus("Project loaded: "+project.scenes.length+" scenes.");
 }catch(e){
  setStatus("Project load nahi ho paya.");
 }
}

function showScenes(){
 const box=$("sceneList");box.innerHTML="";
 project.scenes.forEach((s,i)=>{
  const div=document.createElement("div");
  div.className="scene";
  div.textContent=(i+1)+". "+(s.name||"Scene")+" | "+(s.duration||5)+" sec | "+(s.animation||"idle");
  box.appendChild(div);
 });
}

function background(ctx,s,w,h){
 const colors=backgrounds[s?.background]||backgrounds.village;
 const g=ctx.createLinearGradient(0,0,0,h);
 g.addColorStop(0,colors[0]);
 g.addColorStop(.65,colors[1]);
 g.addColorStop(1,colors[2]);
 ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

 ctx.fillStyle="rgba(255,255,255,.18)";
 ctx.beginPath();ctx.arc(w*.78,h*.16,w*.07,0,Math.PI*2);ctx.fill();

 ctx.fillStyle=colors[2];
 ctx.fillRect(0,h*.78,w,h*.22);

 if(s?.background==="city"){
  for(let i=0;i<8;i++){
   const x=i*w/8;
   ctx.fillStyle="#58647d";
   ctx.fillRect(x,h*.45,w/10,h*.34);
   ctx.fillStyle="#f9dc86";
   for(let j=0;j<3;j++)ctx.fillRect(x+10+j*18,h*.49,8,12);
  }
 }
 if(s?.background==="horror"){
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#18241c";
  for(let i=0;i<5;i++){
   const x=i*w/4;
   ctx.fillRect(x,h*.35,18,h*.45);
   ctx.beginPath();ctx.arc(x+9,h*.34,w*.09,0,Math.PI*2);ctx.fill();
  }
 }
}

function getCharacter(s){
 return characters.find(c=>c.id===s?.characterId)||characters[0]||{
  skin:"#d99b72",hair:"#30201d",outfit:"#4169a9",accent:"#f4bd42"
 };
}

function drawCharacter(s,time){
 if(!s)return;
 if(!window.AnimStudioRig)return;
 const c=getCharacter(s);
 const x=canvas.width*(Number(s.x??50)/100);
 const y=canvas.height*(Number(s.y??70)/100);
 const scale=(canvas.width/720)*Number(s.scale||1);
 AnimStudioRig.draw(ctx,c,s.animation||"idle",time,x,y,scale);
}

function drawObjects(s){
 if(!s)return;
 (s.objects||[]).forEach(o=>{
  const x=canvas.width*(Number(o.x??50)/100);
  const y=canvas.height*(Number(o.y??55)/100);
  const size=Number(o.size||90);
  if(o.assetId&&assetImages[o.assetId]){
   const img=assetImages[o.assetId];
   const ratio=img.width/img.height||1;
   ctx.drawImage(img,x-size/2,y-size/(2*ratio),size,size/ratio);
  }else{
   ctx.font=size+"px Arial";
   ctx.textAlign="center";
   ctx.textBaseline="middle";
   ctx.fillText(o.emoji||"⭐",x,y);
  }
 });
}

function drawScene(s,time){
 if(!s){
  ctx.fillStyle="#222";ctx.fillRect(0,0,canvas.width,canvas.height);
  return;
 }
 background(ctx,s,canvas.width,canvas.height);
 drawObjects(s);
 drawCharacter(s,time);
}

async function loadAssets(){
 assetImages={};
 let db;
 try{
  db=await new Promise((resolve,reject)=>{
   const req=indexedDB.open("AnimStudioAssetsDB",1);
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error);
  });
 }catch(e){return;}

 const ids=new Set();
 project.scenes.forEach(s=>(s.objects||[]).forEach(o=>{
  if(o.assetId)ids.add(o.assetId);
 }));

 for(const id of ids){
  const asset=await new Promise(resolve=>{
   const tx=db.transaction("assets","readonly");
   const req=tx.objectStore("assets").get(id);
   req.onsuccess=()=>resolve(req.result||null);
   req.onerror=()=>resolve(null);
  });
  if(!asset?.blob)continue;
  const url=URL.createObjectURL(asset.blob);
  const img=new Image();
  await new Promise(resolve=>{
   img.onload=resolve;img.onerror=resolve;img.src=url;
  });
  if(img.complete&&img.naturalWidth)assetImages[id]=img;
 }
}

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

async function playPreview(){
 if(!project.scenes.length){setStatus("Pehle project load karo.");return;}
 previewRunning=true;
 const token=++previewToken;
 await loadAssets();
 let time=0;
 for(const s of project.scenes){
  if(!previewRunning||token!==previewToken)break;
  const duration=Math.max(1,Number(s.duration)||5);
  const start=performance.now();
  while(previewRunning&&token===previewToken&&performance.now()-start<duration*1000){
   time+=0.035;
   drawScene(s,time);
   await wait(33);
  }
 }
 previewRunning=false;
 if(token===previewToken)setStatus("Preview complete.");
}

function stopPreview(){
 previewRunning=false;previewToken++;
 drawScene(project.scenes[0],0);
 setStatus("Preview stopped.");
}

async function exportVideo(){
 if(exporting)return;
 if(!project.scenes.length){setStatus("Pehle project load karo.");return;}
 if(!window.MediaRecorder||!canvas.captureStream){
  setStatus("Is browser mein video recording supported nahi hai.");
  return;
 }
 if(!window.AnimStudioRig){
  setStatus("rig.js load nahi hua. File ko editor ke same folder mein rakho.");
  return;
 }

 exporting=true;
 $("progress").value=0;
 $("ratio").disabled=true;
 $("fps").disabled=true;
 $("quality").disabled=true;
 $("transition").disabled=true;

 try{
  await loadAssets();
  const fps=Number($("fps").value);
  const bitrate=Number($("quality").value);
  const stream=canvas.captureStream(fps);

  const mimeTypes=[
   "video/webm;codecs=vp9",
   "video/webm;codecs=vp8",
   "video/webm"
  ];
  const mime=mimeTypes.find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime)throw new Error("WebM recording supported nahi hai.");

  const recorder=new MediaRecorder(stream,{
   mimeType:mime,
   videoBitsPerSecond:bitrate
  });

  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};

  const finished=new Promise((resolve,reject)=>{
   recorder.onstop=resolve;
   recorder.onerror=()=>reject(new Error("Recording error."));
  });

  recorder.start(500);
  let elapsed=0;
  const total=project.scenes.reduce((sum,s)=>sum+Math.max(1,Number(s.duration)||5),0);
  let clock=0;

  for(let i=0;i<project.scenes.length;i++){
   const s=project.scenes[i];
   const duration=Math.max(1,Number(s.duration)||5);
   const start=performance.now();

   while(performance.now()-start<duration*1000){
    const now=performance.now();
    const t=(now-start)/1000;
    clock+=1/fps;
    drawScene(s,clock);

    if($("transition").value==="fade"){
     const fade=.5;
     const remaining=duration-t;
     const alpha=Math.max(0,Math.min(1,(fade-t)/fade,(fade-remaining)/fade));
     if(alpha>0){
      ctx.fillStyle="rgba(0,0,0,"+alpha+")";
      ctx.fillRect(0,0,canvas.width,canvas.height);
     }
    }

    const progress=(elapsed+t)/total*100;
    $("progress").value=Math.min(100,progress);
    setStatus("Exporting scene "+(i+1)+" of "+project.scenes.length+"...");
    await wait(1000/fps);
   }
   elapsed+=duration;
  }

  recorder.stop();
  await finished;
  stream.getTracks().forEach(t=>t.stop());

  const blob=new Blob(chunks,{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="AnimStudio-Video.webm";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),60000);
  $("progress").value=100;
  setStatus("Video export complete! File WebM format mein save hui hai.");
 }catch(error){
  setStatus("Export error: "+error.message);
 }finally{
  exporting=false;
  $("ratio").disabled=false;
  $("fps").disabled=false;
  $("quality").disabled=false;
  $("transition").disabled=false;
 }
}

loadProject();
</script>
</body>
</html>
